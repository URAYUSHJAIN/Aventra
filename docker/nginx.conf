server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API requests go to the Flask container. The first analysis of an asset can take up to ~1 minute (model loading).
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/intelligence, /anomaly-detection, ...) fall back to the SPA entry point.
    location / {
        try_files $uri /index.html;
    }
}
